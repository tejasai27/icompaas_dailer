services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-icompaas_dialer}
      POSTGRES_USER: ${PGUSER:-icompaas_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-icompaas_password}
    # Internal-only by default.
    # Uncomment to expose DB on host:
    # ports:
    #   - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-icompaas_user} -d ${PGDATABASE:-icompaas_dialer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    # Internal-only by default.
    # Uncomment to expose Redis on host:
    # ports:
    #   - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_initial_users &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    # Internal-only by default. Frontend proxies /api and /media to this service.
    # Uncomment to expose backend API directly on host:
    # ports:
    #   - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 1G

  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      NODE_OPTIONS: "--max-old-space-size=768"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      # Single public entrypoint by default: http://<server-ip>/
      - "${PUBLIC_HTTP_PORT:-80}:5173"
    depends_on:
      - backend
    networks:
      - frontend
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  postgres_data:
  backend_media:
